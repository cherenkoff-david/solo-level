name: Deploy database to production

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-prod.yml"
  workflow_dispatch:

concurrency:
  group: db-prod
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx supabase db push --dry-run --remote="$SUPABASE_PROJECT_ID"

      - run: npx supabase db push --yes --remote="$SUPABASE_PROJECT_ID"
