services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=@solo/app -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      VITE_WATCH_POLLING: "true"

volumes:
  app_node_modules:
